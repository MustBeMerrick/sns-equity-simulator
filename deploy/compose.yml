# Run from the server: ~/apps/sns-equity-simulator/src/deploy/compose.yml
# Static site only: app state lives in each browser's localStorage, so there's no data volume.
name: sns-equity-simulator

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: sns-equity-simulator
    restart: unless-stopped
    ports:
      # Bound to loopback only: cloudflared runs on this host and reaches the
      # app via localhost, so there's no need to publish this on the LAN.
      - "127.0.0.1:${SES_PORT:-3004}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:80/"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
